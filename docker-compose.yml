version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: prayana_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prayana
      POSTGRES_PASSWORD: prayana_secure_pass
      POSTGRES_DB: prayana_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prayana -d prayana_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prayana_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://prayana:prayana_secure_pass@postgres:5432/prayana_db
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prayana_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
